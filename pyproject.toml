[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttlcache"
version = "0.1.0"
description = "In-memory LRU cache with per-entry TTLs (debugging environment)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Optional[...] / typing.Callable are kept deliberately for py3.9-style readability.
ignore = ["UP035", "UP045"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
